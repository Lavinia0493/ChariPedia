{% extends "base.html" %}

{% block titulo %}Favoritos{% endblock titulo %}

{% block content %}

    <h1 class="text-white">Aqui estão seus pokemons favoritos!!!</h1>
    <p class="text-white">Você pode apelidar eles também</p>

    {% if favoritos_usuario %}
            <div class="d-flex flex-wrap">
                {% for item in favoritos_usuario %}
                    <div class="p-1" style="flex: 0 0 10%; max-width: 10%;">
                        <div class="card h-100 shadow-sm">
                            <div class="ratio ratio-1x1">
                                <img src="{{item.img}}" class="card-img-top">
                            </div>
                            <div class="card-body d-flex flex-column justify-content-between p-1 text-center m-1">
                                <h6 class="card-title text-truncate mb-1">{{ item.nome }}</h6>
                                <form method="POST" action="{{ url_for('front_controller.apelidar')}}">
                                    <input type="hidden" name="img" value="{{item.img}}">
                                    <input type="hidden" name="nome" value="{{item.nome}}">
                                    <input type="text" name="apelido" id="apelido" class="form-control" placeholder="Apelido">
                                    <button type="submit" class="btn btn-sm btn-danger w-100 my-1">Apelidar</button>
                                </form>
                                <form method="POST" action="{{ url_for('front_controller.remover_poke')}}">
                                    <input type="hidden" name="img" value="{{item.img}}">
                                    <input type="hidden" name="nome" value="{{item.nome}}">
                                    <button type="submit" class="btn btn-sm btn-danger w-100">Remover</button>
                                </form>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

{% endblock content %}
